<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSim Prompt Reader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: white;
            min-height: 100vh;
        }

        .tts-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            font-size: 20px;
            line-height: 1;
        }

        .tts-button:hover {
            background: #f5f5f5;
        }

        .speaker-icon {
            width: 20px;
            height: 20px;
            fill: #333;
        }
    </style>
</head>
<body>
    <button class="tts-button" id="ttsButton"></button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ttsButton = document.getElementById('ttsButton');
            const synth = window.speechSynthesis;
            let isSpeaking = false, textChunks = [], currentChunkIndex = 0;

            const setButtonState = () => ttsButton.textContent = isSpeaking ? '⏹️' : '🔊';

            const stopSpeaking = () => {
                synth.speaking && synth.cancel();
                isSpeaking = false;
                setButtonState();
            };

            const getCurrentPrompt = async () => {
                const project = await window.websim?.getCurrentProject();
                if (!project) throw new Error('No project found');
                const response = await fetch(`/api/v1/projects/${project.id}`);
                if (!response.ok) throw new Error('Failed to fetch project');
                const data = await response.json();
                const prompt = data.site?.prompt;
                if (!prompt) throw new Error('No prompt found');
                return prompt.text ?? prompt;
            };

            const splitText = (text, max = 200) => text.length <= max ? [text] : (text.match(/[^.!?\n\r]+[.!?\n\r]*|[^.!?\n\r]+/g) || []).reduce((acc, sentence) => {
                let chunk = sentence.trim();
                while (chunk.length > max) {
                    const splitPoint = chunk.lastIndexOf(' ', max) > -1 ? chunk.lastIndexOf(' ', max) : max;
                    acc.push(chunk.substring(0, splitPoint));
                    chunk = chunk.substring(splitPoint).trim();
                }
                chunk && acc.push(chunk);
                return acc;
            }, []);

            const speakNextChunk = () => {
                if (!isSpeaking || currentChunkIndex >= textChunks.length) return stopSpeaking();
                const utterance = new SpeechSynthesisUtterance(textChunks[currentChunkIndex]);
                Object.assign(utterance, { rate: 0.9, pitch: 1, volume: 0.8 });
                utterance.onend = () => { currentChunkIndex++; speakNextChunk(); };
                utterance.onerror = e => { console.error(`Speech error: ${e.error}`); stopSpeaking(); };
                synth.speak(utterance);
            };

            const speakPrompt = (text) => {
                if (!text?.trim()) return;
                stopSpeaking();
                isSpeaking = true;
                setButtonState();
                textChunks = splitText(text);
                currentChunkIndex = 0;
                speakNextChunk();
            };

            ttsButton.addEventListener('click', async () => {
                if (isSpeaking) return stopSpeaking();
                try { speakPrompt(await getCurrentPrompt()); } 
                catch (error) { console.error('Error:', error); stopSpeaking(); }
            });
            
            const resumeSynth = () => { synth.paused && synth.resume(); document.removeEventListener('click', resumeSynth, true); };
            document.addEventListener('click', resumeSynth, true);
            document.addEventListener('visibilitychange', () => document.hidden && isSpeaking && stopSpeaking());
            
            setButtonState();
        });
    </script>

</body>
</html>
