<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSim Prompt Reader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: white;
            min-height: 100vh;
        }

        .tts-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            font-size: 20px;
            line-height: 1;
        }

        .tts-button:hover {
            background: #f5f5f5;
        }

        .speaker-icon {
            width: 20px;
            height: 20px;
            fill: #333;
        }
    </style>
</head>
<body>
    <button class="tts-button" id="ttsButton"></button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ttsButton = document.getElementById('ttsButton');
            const synth = window.speechSynthesis;
            let isSpeaking = false;
            let textChunks = [];
            let currentChunkIndex = 0;

            const setButtonState = (state) => {
                ttsButton.textContent = state === 'speaking' ? '⏹️' : '🔊';
            };

            const stopSpeaking = () => {
                if (synth.speaking) synth.cancel();
                isSpeaking = false;
                setButtonState('default');
            };

            const getCurrentPrompt = async () => {
                if (!window.websim) throw new Error('WebSim API not available.');
                const currentProject = await window.websim.getCurrentProject();
                if (!currentProject) throw new Error('No current project found');
                
                const response = await fetch(`/api/v1/projects/${currentProject.id}`);
                if (!response.ok) throw new Error('Failed to fetch project details');
                
                const projectData = await response.json();
                const site = projectData.site;
                if (!site || !site.prompt) throw new Error('No prompt found for this page');

                return (site.prompt && site.prompt.text) ? site.prompt.text : site.prompt;
            };

            const splitTextIntoChunks = (text, maxLength = 200) => {
                if (text.length <= maxLength) return [text];
                
                const chunks = [];
                const sentences = text.match(/[^.!?\n\r]+[.!?\n\r]*|[^.!?\n\r]+/g) || [];

                sentences.forEach(sentence => {
                    let currentChunk = sentence.trim();
                    while (currentChunk.length > maxLength) {
                        let splitPoint = currentChunk.lastIndexOf(' ', maxLength);
                        if (splitPoint === -1) splitPoint = maxLength;
                        chunks.push(currentChunk.substring(0, splitPoint));
                        currentChunk = currentChunk.substring(splitPoint).trim();
                    }
                    if (currentChunk) chunks.push(currentChunk);
                });
                return chunks.filter(chunk => chunk.length > 0);
            };

            const speakNextChunk = () => {
                if (!isSpeaking || currentChunkIndex >= textChunks.length) {
                    stopSpeaking();
                    return;
                }
                const chunk = textChunks[currentChunkIndex];
                const utterance = new SpeechSynthesisUtterance(chunk);
                utterance.rate = 0.9;
                utterance.pitch = 1;
                utterance.volume = 0.8;

                utterance.onend = () => {
                    currentChunkIndex++;
                    speakNextChunk();
                };
                utterance.onerror = (event) => {
                    console.error(`Speech synthesis error: ${event.error}`);
                    stopSpeaking();
                };
                synth.speak(utterance);
            };

            const speakPrompt = (text) => {
                if (!text || text.trim() === '') return;
                stopSpeaking(); 

                isSpeaking = true;
                setButtonState('speaking');
                textChunks = splitTextIntoChunks(text);
                currentChunkIndex = 0;
                speakNextChunk();
            };

            ttsButton.addEventListener('click', async () => {
                if (isSpeaking) {
                    stopSpeaking();
                    return;
                }
                try {
                    const promptText = await getCurrentPrompt();
                    speakPrompt(promptText);
                } catch (error) {
                    console.error('Error:', error);
                    stopSpeaking();
                }
            });

            const resumeSynth = () => {
                if (synth.paused) synth.resume();
                document.removeEventListener('click', resumeSynth, true);
            };
            document.addEventListener('click', resumeSynth, true);

            document.addEventListener('visibilitychange', () => {
                if (document.hidden && isSpeaking) stopSpeaking();
            });

            setButtonState('default');
        });
    </script>

</body>
</html>
